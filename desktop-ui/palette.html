<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Layout</title>
    <!-- Premium Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">


</head>

<body>
    <div id="root">
        <div class="palette">
            <!-- Loader Overlay -->
            <div id="loader" class="loader-overlay">
                <div class="spinner"></div>
                <div class="loader-text" id="loader-msg">Translating Slide...</div>
            </div>

            <!-- Language Selection overlay -->
            <div id="lang-menu" class="lang-menu">
                <div class="lang-header">
                    <div class="back-btn" id="lang-back">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 18l-6-6 6-6" />
                        </svg>
                    </div>
                    Select Language
                </div>
                <div class="results" id="lang-results">
                    <!-- Languages injected by JS -->
                </div>
                <div class="footer">
                    <span class="f-hint"><kbd>Esc</kbd> Back</span>
                    <span class="f-hint"><kbd>↵</kbd> Translate</span>
                </div>
            </div>

            <!-- Options Selection overlay (for Lead Sentence) -->
            <div id="options-menu" class="lang-menu">
                <div class="lang-header">
                    <div class="back-btn" id="options-back">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 18l-6-6 6-6" />
                        </svg>
                    </div>
                    Select Lead Sentence
                </div>
                <div class="results" id="options-results">
                    <!-- Options injected by JS -->
                </div>
                <div class="footer">
                    <span class="f-hint"><kbd>Esc</kbd> Cancel</span>
                    <span class="f-hint"><kbd>↵</kbd> Insert</span>
                </div>
            </div>

            <!-- Generate Slide overlay -->
            <div id="generate-menu" class="lang-menu">
                <div class="lang-header">
                    <div class="back-btn" id="generate-back">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 18l-6-6 6-6" />
                        </svg>
                    </div>
                    Generate Slide
                </div>

                <div style="flex: 1; display: flex; flex-direction: column; overflow-y: auto;">
                    <!-- Input State -->
                    <div id="generate-input-container" style="padding: 16px; margin-top: 10px;">
                        <textarea id="generate-prompt"
                            placeholder="Describe the slide you want to create (e.g. 'A 4-part strategy timeline for Q3')..."
                            spellcheck="false"></textarea>
                    </div>

                    <!-- Loading State -->
                    <div id="generate-loading-container"
                        style="display: none; flex: 1; min-height: 200px; padding: 24px; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 24px;">
                        <div class="spinner" style="width: 36px; height: 36px; border-width: 3px;"></div>
                        <div id="generate-status"
                            style="font-size: 15px; font-weight: 500; color: var(--text-main); height: 24px; display: flex; align-items: center; justify-content: center;">
                        </div>
                    </div>

                    <!-- Success State -->
                    <div id="generate-success-container"
                        style="display: none; flex: 1; min-height: 200px; padding: 24px; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
                        <div class="success-circle">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 6L9 17l-5-5" />
                            </svg>
                        </div>
                        <div id="generate-explanation"
                            style="font-size: 14px; color: var(--text-strong); line-height: 1.6; max-width: 90%;"></div>
                        <button id="generate-another-btn"
                            style="margin-top: 10px; padding: 10px 16px; border: none; border-radius: 8px; background: var(--border); color: var(--text-strong); font-weight: 600; cursor: pointer; transition: background 0.15s; font-family: 'Plus Jakarta Sans', sans-serif;">Generate
                            Another</button>
                    </div>
                </div>

                <div class="footer" id="generate-footer">
                    <span class="f-hint"><kbd>Esc</kbd> Cancel</span>
                    <span class="f-hint" id="generate-action-hint"><kbd>↵</kbd> Generate</span>
                </div>
            </div>
            <!-- Search -->
            <div class="search-bar">
                <span class="search-icon">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                        <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="2" />
                        <path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </span>
                <input id="search" type="text" placeholder="Search commands..." autocomplete="off" spellcheck="false"
                    autofocus />
                <span class="shortcut-hint">Esc</span>
            </div>

            <!-- Results -->
            <div class="results" id="results"></div>

            <!-- Footer -->
            <div class="footer">
                <span class="f-profile" id="profile-btn" title="My Profile">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Profile
                </span>
                <div class="f-right">
                    <span class="f-hint"><kbd>↑</kbd> <kbd>↓</kbd> Navigate</span>
                    <span class="f-hint"><kbd>↵</kbd> Run</span>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>

</body>

</html>
