name: Build MSIX Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build frontend dist
      run: |
        npm ci
        npm run build

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Conslide\Conslide.csproj

    - name: Build Conslide.exe (Release x64)
      run: |
        msbuild Conslide\Conslide.csproj /p:Configuration=Release /p:Platform=x64

    - name: Prepare MSIX staging folder
      shell: pwsh
      run: |
        # Get version from tag (e.g. v1.2.0 -> 1.2.0.0)
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart("v") + ".0"
        Write-Host "Building MSIX version: $version"

        # Create staging directory
        $staging = "msix_staging"
        New-Item -ItemType Directory -Force -Path $staging | Out-Null

        # Copy all built app files
        Copy-Item -Path "Conslide\bin\Release\net48\*" -Destination $staging -Recurse -Force

        # Copy store assets into staging/Assets
        New-Item -ItemType Directory -Force -Path "$staging\Assets" | Out-Null
        Copy-Item -Path "Conslide.Package\Assets\*" -Destination "$staging\Assets" -Recurse -Force

        # Generate AppxManifest.xml from the existing manifest, updating version
        $manifestContent = @"
<?xml version="1.0" encoding="utf-8"?>
<Package
  xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
  xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
  xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
  IgnorableNamespaces="uap rescap">

  <Identity
    Name="Mostafaeldiwany123.Conslide"
    Publisher="CN=Mostafa Diwany"
    Version="$version"
    ProcessorArchitecture="x64" />

  <Properties>
    <DisplayName>Conslide</DisplayName>
    <PublisherDisplayName>Mostafa Diwany</PublisherDisplayName>
    <Logo>Assets\StoreLogo.png</Logo>
  </Properties>

  <Dependencies>
    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.22000.0" />
  </Dependencies>

  <Resources>
    <Resource Language="en-us" />
  </Resources>

  <Applications>
    <Application Id="Conslide" Executable="Conslide.exe" EntryPoint="Windows.FullTrustApplication">
      <uap:VisualElements
        DisplayName="Conslide"
        Description="PowerPoint productivity tool for faster slide creation"
        BackgroundColor="transparent"
        Square150x150Logo="Assets\Square150x150Logo.png"
        Square44x44Logo="Assets\Square44x44Logo.png">
        <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />
      </uap:VisualElements>
    </Application>
  </Applications>

  <Capabilities>
    <rescap:Capability Name="runFullTrust" />
    <Capability Name="internetClient" />
  </Capabilities>

</Package>
"@
        Set-Content -Path "$staging\AppxManifest.xml" -Value $manifestContent -Encoding UTF8
        Write-Host "Manifest written with version $version"

    - name: Create self-signed cert for signing
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=Mostafa Diwany" `
          -KeyUsage DigitalSignature `
          -FriendlyName "Conslide Test Cert" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

        $thumb = $cert.Thumbprint
        Write-Host "Cert thumbprint: $thumb"
        echo "CERT_THUMBPRINT=$thumb" >> $env:GITHUB_ENV

        # Export cert as PFX for signing
        $pwd = ConvertTo-SecureString -String "conslide123" -Force -AsPlainText
        Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath "conslide_cert.pfx" -Password $pwd
        Write-Host "Certificate exported."

    - name: Pack MSIX with makeappx
      shell: pwsh
      run: |
        # Find makeappx.exe from Windows SDK
        $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" |
          Where-Object { $_.FullName -match "x64" } |
          Sort-Object FullName -Descending |
          Select-Object -First 1 -ExpandProperty FullName

        Write-Host "Using makeappx: $makeappx"
        & "$makeappx" pack /d msix_staging /p Conslide.msix /nv
        Write-Host "MSIX packed successfully."

    - name: Sign MSIX with signtool
      shell: pwsh
      run: |
        # Find signtool.exe from Windows SDK
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
          Where-Object { $_.FullName -match "x64" } |
          Sort-Object FullName -Descending |
          Select-Object -First 1 -ExpandProperty FullName

        Write-Host "Using signtool: $signtool"

        $thumb = $env:CERT_THUMBPRINT
        & "$signtool" sign /fd SHA256 /sha1 $thumb /tr http://timestamp.digicert.com /td SHA256 Conslide.msix
        Write-Host "MSIX signed successfully."

    - name: Upload MSIX as GitHub Release asset
      uses: softprops/action-gh-release@v1
      with:
        name: "Conslide ${{ github.ref_name }}"
        body: |
          ## Conslide ${{ github.ref_name }}

          ### Installation
          1. Download `Conslide.msix` below
          2. Enable **Developer Mode** in Windows Settings → System → For Developers
          3. Double-click the `.msix` file to install
          4. Launch **Conslide** from the Start Menu
        files: Conslide.msix
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}