name: Build MSIX Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build frontend dist
      run: |
        npm ci
        npm run build

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Conslide\Conslide.csproj

    - name: Build Conslide.exe (Release x64)
      run: |
        msbuild Conslide\Conslide.csproj /p:Configuration=Release /p:Platform=x64

    - name: Prepare MSIX staging folder
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart("v") + ".0"
        Write-Host "Building MSIX version: $version"

        $staging = "msix_staging"
        New-Item -ItemType Directory -Force -Path $staging | Out-Null

        Copy-Item -Path "Conslide\bin\Release\net48\*" -Destination $staging -Recurse -Force

        New-Item -ItemType Directory -Force -Path "$staging\Assets" | Out-Null
        Copy-Item -Path "Conslide.Package\Assets\*" -Destination "$staging\Assets" -Recurse -Force

    - name: Generate AppxManifest.xml
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart("v") + ".0"

        $manifest = "Conslide.Package\Package.appxmanifest"
        $content = Get-Content $manifest -Raw

        $content = $content -replace 'Version="[^"]*"', "Version=`"$version`""

        if ($content -notmatch 'ProcessorArchitecture') {
          $content = $content -replace '(Version="[^"]*")', "`$1`n    ProcessorArchitecture=`"x64`""
        }

        Set-Content -Path "msix_staging\AppxManifest.xml" -Value $content -Encoding UTF8
        Write-Host "Manifest written with version $version"

    - name: Create self-signed cert for signing
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=Mostafa Diwany" `
          -KeyUsage DigitalSignature `
          -FriendlyName "Conslide Test Cert" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

        $thumb = $cert.Thumbprint
        Write-Host "Cert thumbprint: $thumb"
        echo "CERT_THUMBPRINT=$thumb" >> $env:GITHUB_ENV

        # Export cert as PFX for signing
        $pwd = ConvertTo-SecureString -String "conslide123" -Force -AsPlainText
        Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath "conslide_cert.pfx" -Password $pwd
        Write-Host "Certificate exported."

    - name: Pack MSIX with makeappx
      shell: pwsh
      run: |
        # Find makeappx.exe from Windows SDK
        $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" |
          Where-Object { $_.FullName -match "x64" } |
          Sort-Object FullName -Descending |
          Select-Object -First 1 -ExpandProperty FullName

        Write-Host "Using makeappx: $makeappx"
        & "$makeappx" pack /d msix_staging /p Conslide.msix /nv
        Write-Host "MSIX packed successfully."

    - name: Sign MSIX with signtool
      shell: pwsh
      run: |
        # Find signtool.exe from Windows SDK
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
          Where-Object { $_.FullName -match "x64" } |
          Sort-Object FullName -Descending |
          Select-Object -First 1 -ExpandProperty FullName

        Write-Host "Using signtool: $signtool"

        $thumb = $env:CERT_THUMBPRINT
        & "$signtool" sign /fd SHA256 /sha1 $thumb /tr http://timestamp.digicert.com /td SHA256 Conslide.msix
        Write-Host "MSIX signed successfully."

    - name: Upload MSIX as GitHub Release asset
      uses: softprops/action-gh-release@v1
      with:
        name: "Conslide ${{ github.ref_name }}"
        body: |
          ## Conslide ${{ github.ref_name }}

          ### Installation
          1. Download `Conslide.msix` below
          2. Enable **Developer Mode** in Windows Settings → System → For Developers
          3. Double-click the `.msix` file to install
          4. Launch **Conslide** from the Start Menu
        files: Conslide.msix
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}