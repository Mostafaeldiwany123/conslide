name: Build MSIX Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build frontend dist
      run: |
        npm ci
        npm run build

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: |
        nuget restore Conslide.sln

    - name: Build Conslide (Release x64)
      run: |
        msbuild Conslide.sln /p:Configuration=Release /p:Platform=x64 /p:RestorePackages=false

    - name: Create MSIX Package
      run: |
        $version = "${{ github.ref_name }}".Replace("v", "")
        # Update version in Package.appxmanifest
        $manifest = "Conslide.Package\Package.appxmanifest"
        (Get-Content $manifest) -replace 'Version="[^"]*"', "Version=`"$version.0`"" | Set-Content $manifest
        # Build MSIX package
        msbuild Conslide.Package\Conslide.Package.wapproj /p:Configuration=Release /p:Platform=x64 /p:AppxBundlePlatforms="x64" /p:AppxPackageDir="..\Packages\" /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Packages/*.msixupload
          Packages/*.msix
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}