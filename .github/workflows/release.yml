name: Build MSIX Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build frontend dist
      run: |
        npm ci
        npm run build

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Conslide (Release x64)
      run: |
        nuget restore Conslide\Conslide.csproj
        msbuild Conslide\Conslide.csproj /p:Configuration=Release /p:Platform=x64

    - name: Create MSIX Package
      run: |
        $version = "${{ github.ref_name }}".Replace("v", "")
        # Update version in Package.appxmanifest
        $manifest = "Conslide.Package\Package.appxmanifest"
        (Get-Content $manifest) -replace 'Version="[^"]*"', "Version=`"$version.0`"" | Set-Content $manifest
        # Build MSIX package (without restoring, just packaging)
        msbuild Conslide.Package\Conslide.Package.wapproj /p:Configuration=Release /p:Platform=x64 /p:SkipValidation=true /p:AppxPackageDir="..\Packages\" /p:UapAppxPackageBuildMode=StoreUpload

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Packages/*.msixupload
          Packages/*.msix
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}