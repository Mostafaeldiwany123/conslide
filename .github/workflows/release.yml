name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build frontend dist
      run: |
        npm ci
        npm run build

    - name: Restore NuGet packages
      run: |
        dotnet restore Conslide/Conslide.csproj

    - name: Build Conslide
      run: |
        dotnet build Conslide/Conslide.csproj -c Release --no-restore

    - name: Zip Release Files
      run: |
        Compress-Archive -Path "Conslide/bin/Release/net48/*" -DestinationPath "Conslide-${{ github.ref_name }}.zip"

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        name: "Conslide ${{ github.ref_name }}"
        body: |
          ## Conslide ${{ github.ref_name }}

          Download `Conslide-${{ github.ref_name }}.zip`, extract it, and run `Conslide.exe`.
        files: |
          Conslide-${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}