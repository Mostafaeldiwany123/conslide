name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build frontend dist
      run: |
        npm ci
        npm run build

    - name: Restore NuGet packages
      run: |
        dotnet restore Conslide/Conslide.csproj

    - name: Build Conslide
      run: |
        dotnet build Conslide/Conslide.csproj -c Release --no-restore

    - name: Create Release Archive
      run: |
        $version = "${{ github.ref_name }}".Replace("v", "")
        $releaseDir = "Releases"
        New-Item -ItemType Directory -Force -Path $releaseDir
        Copy-Item "Conslide/bin/Release/net48/*" -Destination "$releaseDir/" -Recurse
        Compress-Archive -Path "$releaseDir/*" -DestinationPath "Conslide-$version.zip"

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Conslide-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}